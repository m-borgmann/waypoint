                        <path d="M420 108 h12 M426 102 v12" stroke-opacity="0.08" />

                style="position: absolute; bottom: 60px; right: 185px; width: 90px; height: 90px; border-radius: 24px; display: grid; place-items: center; font-size: 45px; transform: rotate(-4deg); background: linear-gradient(150deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 55%, rgba(120,180,240,0.14)); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.30), inset 0 -14px 24px rgba(0,0,0,0.18), 0 18px 40px rgba(0,0,0,0.38); backdrop-filter: blur(18px) saturate(175%);">

            <div style="display: flex; align-items: flex-end; line-height: 1.08;">

                    style="font-size: 132px; font-weight: 700; letter-spacing: 0em; padding-bottom: 0.14em; background: linear-gradient(178deg, #ffffff 0%, #f6f8fb 22%, #e4eaf1 44%, #b0bac8 70%, #939dab 88%, #a8b2c0 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 1px 0 rgba(255,255,255,0.26)) drop-shadow(0 -1px 0 rgba(0,0,0,0.16)) drop-shadow(0 2px 3px rgba(0,0,0,0.16)) drop-shadow(0 16px 36px rgba(0,0,0,0.32))">
                    waypoint</div>

                    style="margin-left: 2px; padding-bottom: 0.14em; font-size: 132px; font-weight: 800; line-height: 1.08; color: #5fd8c4; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.16)) drop-shadow(0 12px 28px rgba(0,0,0,0.3));">
