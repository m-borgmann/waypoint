<!DOCTYPE html>
<html>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

<style>
    body {
        max-width: 1280px;
    }

    .container {
        aspect-ratio: 4/1;
        background: linear-gradient(45deg, rgba(252, 254, 255, 1) 0%, rgba(234, 244, 255, 1) 40%, rgba(207, 230, 255, 1) 100%);
        border-radius: 12px;
        align-content: center;
        justify-items: center;
        position: relative;
        overflow: hidden;
        outline: 2px solid #23395D20;
        outline-offset: -12px;
        outline-style: dashed;
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
    }

    .title-wrapper {
        display: flex;
        flex-direction: row;
    }

    .title {
        position: relative;
        z-index: 1;
        font-size: 120px;
        margin-top: 12px;
        font-weight: 700;
        font-style: italic;
        letter-spacing: 2px;
        background-clip: text !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent;
        background: linear-gradient(45deg,
                #6E97C9 0%,
                #3B5F8A 45%,
                #23395D 100%);
    }

    .title-dot {
        color: #6ec9ab;
        z-index: 1;
        font-size: 120px;
        margin-top: 12px;
        font-weight: 700;
    }

    .subtitle {
        margin-top: 12px;
        font-weight: 400;
        font-size: 28px;
        color: #64738d;
    }

    .font-inter {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
    }
</style>

<body>
    <div class="container">
        <svg class="overlay" viewBox="0 0 1280 320" preserveAspectRatio="none">
            <!-- ================= LEFT CONSTELLATIONS ================= -->
            <!-- Cassiopeia -->
            <g stroke="#23395D" stroke-width="1.5" opacity="0.10">
                <line x1="55"  y1="265" x2="95"  y2="235"/>
                <line x1="95"  y1="235" x2="140" y2="265"/>
                <line x1="140" y1="265" x2="185" y2="235"/>
                <line x1="185" y1="235" x2="225" y2="265"/>
            </g>
            <g fill="#23395D" opacity="0.8">
                <circle cx="55"  cy="265" r="2"/>
                <circle cx="95"  cy="235" r="2.5"/>
                <circle cx="140" cy="265" r="2"/>
                <circle cx="185" cy="235" r="2.3"/>
                <circle cx="225" cy="265" r="2"/>
            </g>

            <!-- ================= RIGHT CONSTELLATIONS ================= -->
            <!-- Orion -->
            <g stroke="#23395D" stroke-width="1.5" opacity="0.10">
                <line x1="1040" y1="86" x2="1095" y2="65" />
                <line x1="1095" y1="65" x2="1150" y2="94" />
                <line x1="1150" y1="94" x2="1205" y2="70" />
                <line x1="1095" y1="65" x2="1125" y2="40" />
            </g>
            <g fill="#23395D" opacity="0.8">
                <circle cx="1040" cy="86" r="2" />
                <circle cx="1095" cy="65" r="2.5" />
                <circle cx="1150" cy="94" r="2" />
                <circle cx="1205" cy="70" r="2" />
                <circle cx="1125" cy="40" r="1.8" />
            </g>

            <!-- Diamond -->
            <g stroke="#23395D" stroke-width="1.4" opacity="0.10">
                <line x1="1145" y1="235" x2="1170" y2="210"/>
                <line x1="1170" y1="210" x2="1195" y2="235"/>
                <line x1="1195" y1="235" x2="1170" y2="260"/>
                <line x1="1170" y1="260" x2="1145" y2="235"/>
            </g>
            <g fill="#23395D" opacity="0.75">
                <circle cx="1145" cy="235" r="2"/>
                <circle cx="1170" cy="210" r="2"/>
                <circle cx="1195" cy="235" r="2"/>
                <circle cx="1170" cy="260" r="2"/>
            </g>

            <!-- ================= DOT STARS ================= -->
            <g fill="#23395D">
                <circle cx="40" cy="175" r="1.4" opacity=".45" />
                <circle cx="95" cy="110" r="1.5" opacity=".45" />
                <circle cx="115" cy="123" r="1.6" opacity=".50" />

                <circle cx="1125" cy="145" r="1.8" opacity=".55" />
                <circle cx="1235" cy="110" r="1.4" opacity=".45" />
            </g>

            <!-- ================= PLUS STARS ================= -->
            <g stroke="#23395D" stroke-width="1.2" opacity="0.8">
                <line x1="205" y1="95" x2="205" y2="107" />
                <line x1="199" y1="101" x2="211" y2="101" />

                <line x1="1090" y1="260" x2="1090" y2="272" />
                <line x1="1084" y1="266" x2="1096" y2="266" />
            </g>

            <!-- ================= X STARS ================= -->
            <g stroke="#23395D" stroke-width="1.2" opacity=".75">
                <line x1="155" y1="170" x2="165" y2="180" />
                <line x1="165" y1="170" x2="155" y2="180" />

                <line x1="1185" y1="165" x2="1195" y2="175" />
                <line x1="1195" y1="165" x2="1185" y2="175" />
            </g>

            <!-- ================= RING STARS ================= -->
            <g fill="none" stroke="#23395D" stroke-width="1.3" opacity=".60">
                <circle cx="85" cy="65" r="3" />
                <circle cx="1225" cy="265" r="3.5" />
            </g>
        </svg>

        <div class="title-wrapper">
            <div class="title font-inter">
                waypoint
            </div>

            <div class="title-dot font-inter">.</div>
        </div>

        <div class="subtitle font-inter">
            an agentic engineering workflow
        </div>
    </div>
</body>

</html>
